[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tlm01-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "statsmodels>=0.14.6",
    "scikit-bio>=0.7.2",
    "networkx>=3.0",
    "python-docx>=1.1",
    "adjusttext>=1.3.0",
    "pingouin>=0.6.1",
]

[project.scripts]
thesis = "cli:main"
ancova = "commands.ancova:main"

[tool.hatch.build.targets.wheel]
include = ["cli.py", "data.py", "biomarkers.py", "stats.py", "docx_utils.py", "commands/"]
